apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atlas-platform.fullname" . }}-config
  labels:
    {{- include "atlas-platform.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}